name: Update data and deploy

# - push to main:      test and deploy the site to GitHub Pages
# - daily schedule:    check for a new stable Factorio release; if there is one,
#                      regenerate the recipe data, commit it and deploy
# - manual dispatch:   same as the schedule, optionally forcing a rebuild
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the data even if the Factorio version is unchanged
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Update recipe data from wube/factorio-data
        id: data
        if: github.event_name != 'push'
        run: |
          node tools/update-data.mjs ${{ inputs.force && '--force' || '' }}
          if [ -n "$(git status --porcelain site/data)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Also guards the data: a broken extraction fails here, before commit and deploy.
      - run: npm test

      - name: Commit updated data
        if: steps.data.outputs.changed == 'true'
        run: |
          version=$(node -p "require('./site/data/meta.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git commit -m "Update recipe data to Factorio $version"
          git push

      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.data.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.data.outputs.changed == 'true'
        with:
          path: site

      - id: deployment
        if: github.event_name != 'schedule' || steps.data.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
