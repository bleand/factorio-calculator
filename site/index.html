<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Factorio Calculator</title>
    <meta
      name="description"
      content="Pick a Factorio item and a production rate, get every step down to raw materials and the number of machines to build."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="panel sidebar">
        <div class="brand">
          <h1>Factorio Calculator</h1>
          <p id="data-version" class="meta">Loading data…</p>
        </div>

        <section>
          <h2 class="section-label">Game</h2>
          <div class="segmented" id="mode" role="radiogroup" aria-label="Game mode">
            <button type="button" role="radio" data-value="vanilla">Base game</button>
            <button type="button" role="radio" data-value="space-age">Space Age</button>
          </div>
        </section>

        <section>
          <h2 class="section-label">Target</h2>
          <label class="field">
            <span>Item</span>
            <div class="combo">
              <input
                id="item-search"
                type="text"
                autocomplete="off"
                spellcheck="false"
                role="combobox"
                aria-expanded="false"
                aria-controls="item-list"
                placeholder="Search items…"
              />
              <ul id="item-list" class="combo-list" role="listbox" hidden></ul>
            </div>
          </label>
          <div class="field">
            <label for="rate">Amount</label>
            <div class="rate-row">
              <input id="rate" type="number" min="0" step="any" inputmode="decimal" />
              <div class="segmented" id="unit" role="radiogroup" aria-label="Time unit">
                <button type="button" role="radio" data-value="s">/ sec</button>
                <button type="button" role="radio" data-value="min">/ min</button>
              </div>
            </div>
          </div>
        </section>

        <section>
          <h2 class="section-label">Default machines</h2>
          <label class="field"><span>Assembler</span><select id="pref-assembler"></select></label>
          <label class="field"><span>Furnace</span><select id="pref-furnace"></select></label>
          <label class="field"><span>Mining drill</span><select id="pref-drill"></select></label>
        </section>

        <section>
          <button type="button" class="btn-secondary" id="reset" hidden>Reset recipe &amp; machine choices</button>
        </section>

        <p class="meta footnote">
          No modules, beacons or research bonuses yet. Machine built-in productivity (foundry, etc.) is included.
        </p>
      </aside>

      <main class="panel main" id="results" aria-live="polite"></main>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
